<body class="bg-background text-on-background antialiased min-h-screen selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar (Shared Component) -->
<header class="fixed top-0 w-full z-50 bg-background dark:bg-background flex justify-between items-center px-gutter h-16 max-w-7xl mx-auto flat no shadows">
<button class="text-on-surface-variant hover:bg-surface-variant/20 rounded-full p-2 transition-colors duration-200 flex items-center justify-center">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">
            Shikkhok AI
        </h1>
<button class="text-primary hover:bg-surface-variant/20 rounded-full p-2 transition-colors duration-200 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 pb-stack-lg px-gutter max-w-3xl mx-auto w-full flex flex-col gap-stack-lg">
<!-- Page Title -->
<section class="flex items-center justify-between">
<h2 class="font-headline-lg text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">
                নোটিফিকেশন
            </h2>
<button class="font-label-md text-label-md text-primary hover:bg-indigo-soft px-3 py-1.5 rounded-full transition-colors">
                সবগুলো পড়া হয়েছে
            </button>
</section>
<!-- Notifications List -->
<section class="flex flex-col gap-stack-md relative z-10">
<!-- Item 1: Unread -->
<div class="group relative bg-surface border border-outline-variant/30 rounded-xl p-4 flex gap-4 items-start shadow-sm hover:shadow-[0_10px_15px_-3px_rgba(99,102,241,0.05)] transition-all duration-300 overflow-hidden">
<!-- Unread Indicator Line -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary rounded-l-xl"></div>
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-primary-container/10 flex items-center justify-center mt-1">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">target</span>
</div>
<div class="flex flex-col gap-1 flex-grow">
<div class="flex justify-between items-start gap-2">
<h3 class="font-label-md text-label-md text-on-surface">আজকের লক্ষ্য</h3>
<span class="font-caption text-caption text-primary whitespace-nowrap">2h ago</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">
                        আজকের গণিত প্র্যাকটিস এখনও বাকি।
                    </p>
</div>
</div>
<!-- Item 2: Unread with Action -->
<div class="group relative bg-surface border border-outline-variant/30 rounded-xl p-4 flex gap-4 items-start shadow-sm hover:shadow-[0_10px_15px_-3px_rgba(99,102,241,0.05)] transition-all duration-300 overflow-hidden">
<!-- Unread Indicator Line -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary rounded-l-xl"></div>
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-primary-container/10 flex items-center justify-center mt-1">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">assignment_turned_in</span>
</div>
<div class="flex flex-col gap-1 flex-grow">
<div class="flex justify-between items-start gap-2">
<h3 class="font-label-md text-label-md text-on-surface">পরীক্ষার ফল</h3>
<span class="font-caption text-caption text-primary whitespace-nowrap">5h ago</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mb-2">
                        Science Chapter Test-এর ফল প্রস্তুত।
                    </p>
<div>
<button class="inline-flex items-center gap-1 font-label-md text-label-md text-primary bg-indigo-soft hover:bg-surface-variant px-4 py-2 rounded-lg transition-colors">
                            ফলাফল দেখো
                            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</div>
<!-- Item 3: Read -->
<div class="group relative bg-surface border border-outline-variant/20 rounded-xl p-4 flex gap-4 items-start transition-all duration-300 opacity-80 hover:opacity-100">
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-surface-variant/50 flex items-center justify-center mt-1">
<span class="material-symbols-outlined text-outline">menu_book</span>
</div>
<div class="flex flex-col gap-1 flex-grow">
<div class="flex justify-between items-start gap-2">
<h3 class="font-label-md text-label-md text-on-surface">নতুন অধ্যায়</h3>
<span class="font-caption text-caption text-outline whitespace-nowrap">1d ago</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">

                    </p>
</div>
