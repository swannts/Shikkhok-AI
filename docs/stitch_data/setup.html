<style>

<body class="bg-background min-h-screen flex flex-col relative selection:bg-primary-fixed selection:text-on-primary-fixed">

<!-- Progress Bar (Level 2 out of 5) -->

<div class="h-full bg-primary rounded-full transition-all duration-700 ease-out" style="width: 40%;"></div>
</div>

<!-- Main Canvas -->

<h1 class="font-headline-xl-mobile text-headline-xl-mobile md:font-headline-xl md:text-headline-xl text-on-background mb-stack-sm text-balance">

            </p>

<!-- Bento Grid for Class Selection -->
<div class="grid grid-cols-2 md:grid-cols-3 gap-stack-md md:gap-stack-lg fade-up-enter" id="classGrid" style="animation-delay: 0.2s;">
<!-- Class Option Generator Pattern -->
<label class="relative block cursor-pointer group h-full">
<input class="peer sr-only" name="class_level" type="radio" value="6"/>
<div class="h-full bg-surface border border-outline-variant rounded-xl p-stack-lg flex flex-col items-center justify-center gap-2 transition-all duration-300 hover:border-primary hover:shadow-[0_10px_15px_-3px_rgba(70,72,212,0.08)] hover:-translate-y-1 peer-checked:border-2 peer-checked:border-primary peer-checked:bg-indigo-soft peer-checked:shadow-[0_10px_15px_-3px_rgba(70,72,212,0.12)]">
<span class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface group-hover:text-primary peer-checked:text-primary transition-colors">৬ষ্ঠ</span>
<span class="font-caption text-caption text-on-surface-variant uppercase tracking-widest peer-checked:text-primary transition-colors">Class VI</span>
<!-- Selection Indicator -->
<div class="absolute top-4 right-4 opacity-0 scale-50 peer-checked:opacity-100 peer-checked:scale-100 text-primary transition-all duration-300">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</label>

<span class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface group-hover:text-primary peer-checked:text-primary transition-colors">৮ম</span>

<span class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface group-hover:text-primary peer-checked:text-primary transition-colors">৯ম</span>

<span class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface group-hover:text-primary peer-checked:text-primary transition-colors">১০ম</span>

<!-- Higher Secondary Grouping - Spans 2 columns on small mobile to center if needed, but flex handles it better. Using standard grid span here. -->
<label class="relative block cursor-pointer group h-full md:col-span-1">

<div class="h-full bg-surface border border-outline-variant rounded-xl p-stack-lg flex flex-col items-center justify-center gap-2 transition-all duration-300 hover:border-primary hover:shadow-[0_10px_15px_-3px_rgba(70,72,212,0.08)] hover:-translate-y-1 peer-checked:border-2 peer-checked:border-primary peer-checked:bg-indigo-soft peer-checked:shadow-[0_10px_15px_-3px_rgba(70,72,212,0.12)]">

<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface/80 backdrop-blur-md border-t border-surface-variant p-container-margin-mobile z-50 transform translate-y-0 transition-transform duration-300">
<div class="max-w-4xl mx-auto flex justify-end">
<!-- Button starts disabled visually until a class is selected -->
<button class="w-full md:w-auto md:min-w-[200px] h-[48px] bg-surface-variant text-on-surface-variant font-label-md text-label-md rounded-xl transition-all duration-300 flex items-center justify-center gap-2 cursor-not-allowed" disabled="" id="continueBtn">
<span>চালিয়ে যাও</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
<!-- Logic to enable button on selection -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const radioButtons = document.querySelectorAll('input[name="class_level"]');
            const continueBtn = document.getElementById('continueBtn');

            radioButtons.forEach(radio => {
                radio.addEventListener('change', () => {
                    if(document.querySelector('input[name="class_level"]:checked')) {
                        // Enable button visually and functionally
                        continueBtn.disabled = false;
                        continueBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'cursor-not-allowed');
                        continueBtn.classList.add('bg-primary', 'text-on-primary', 'shadow-md', 'hover:bg-primary/90', 'active:scale-95', 'cursor-pointer');
                    }
                });
            });
        });
    </script>
