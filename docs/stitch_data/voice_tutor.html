<!DOCTYPE html>

<html lang="bn"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Shikkhok AI - Voice Tutor</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS & Config -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed-dim": "#c0c1ff",
                    "surface-bright": "#f8f9ff",
                    "on-background": "#0b1c30",
                    "on-tertiary-fixed-variant": "#8b005b",
                    "secondary": "#4659a7",
                    "surface-variant": "#d3e4fe",
                    "inverse-surface": "#213145",
                    "on-secondary": "#ffffff",
                    "on-primary-container": "#fffbff",
                    "tertiary": "#b10076",
                    "error": "#EF4444",
                    "on-tertiary-container": "#fffbff",
                    "surface-container-high": "#dce9ff",
                    "on-secondary-fixed-variant": "#2d418d",
                    "surface": "#FFFFFF",
                    "outline": "#767586",
                    "surface-dim": "#cbdbf5",
                    "background": "#F8FAFC",
                    "error-container": "#ffdad6",
                    "outline-variant": "#c7c4d7",
                    "on-primary-fixed": "#07006c",
                    "primary": "#4648d4",
                    "tertiary-fixed-dim": "#ffafd3",
                    "surface-container": "#e5eeff",
                    "secondary-fixed": "#dde1ff",
                    "secondary-fixed-dim": "#b8c4ff",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-fixed-variant": "#2f2ebe",
                    "on-primary": "#ffffff",
                    "surface-tint": "#494bd6",
                    "on-secondary-container": "#273b88",
                    "secondary-container": "#97a9fd",
                    "on-error-container": "#93000a",
                    "inverse-on-surface": "#eaf1ff",
                    "tertiary-fixed": "#ffd8e7",
                    "indigo-soft": "#EEF2FF",
                    "on-tertiary": "#ffffff",
                    "tertiary-container": "#d32b90",
                    "warning": "#F59E0B",
                    "primary-container": "#6063ee",
                    "on-surface-variant": "#464554",
                    "success": "#10B981",
                    "surface-container-low": "#eff4ff",
                    "on-surface": "#0b1c30",
                    "on-error": "#ffffff",
                    "inverse-primary": "#c0c1ff",
                    "on-secondary-fixed": "#001454",
                    "surface-container-highest": "#d3e4fe",
                    "primary-fixed": "#e1e0ff",
                    "on-tertiary-fixed": "#3d0026"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-margin-desktop": "64px",
                    "stack-md": "16px",
                    "unit": "8px",
                    "container-margin-mobile": "16px",
                    "gutter": "16px",
                    "stack-lg": "24px",
                    "stack-sm": "8px"
            },
            "fontFamily": {
                    "caption": ["Be Vietnam Pro", "sans-serif"],
                    "headline-xl": ["Be Vietnam Pro", "sans-serif"],
                    "headline-lg": ["Be Vietnam Pro", "sans-serif"],
                    "body-md": ["Be Vietnam Pro", "sans-serif"],
                    "body-lg": ["Be Vietnam Pro", "sans-serif"],
                    "label-md": ["Be Vietnam Pro", "sans-serif"],
                    "headline-xl-mobile": ["Be Vietnam Pro", "sans-serif"],
                    "headline-md": ["Be Vietnam Pro", "sans-serif"]
            },
            "fontSize": {
                    "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                    "headline-xl": ["40px", { "lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                    "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                    "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                    "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                    "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                    "headline-xl-mobile": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                    "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
            },
            "animation": {
                'pulse-ring': 'pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                'pulse-ring-delayed': 'pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) 1s infinite',
                'bounce-soft': 'bounce-soft 2s ease-in-out infinite'
            },
            "keyframes": {
                'pulse-ring': {
                    '0%': { transform: 'scale(0.8)', opacity: '0.8' },
                    '100%': { transform: 'scale(1.5)', opacity: '0' },
                },
                'bounce-soft': {
                    '0%, 100%': { transform: 'translateY(-2%)' },
                    '50%': { transform: 'translateY(2%)' },
                }
            }
          }
        }
      }
    </script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #F8FAFC; /* background */
            margin: 0;
            overflow: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="h-screen w-full flex flex-col text-on-background relative overflow-hidden">
<!-- Minimal Header / Navigation (Focused Mode) -->
<header class="w-full p-gutter flex justify-between items-center z-10">
<button class="w-12 h-12 rounded-full flex items-center justify-center bg-surface border border-outline-variant hover:bg-surface-container-low transition-colors shadow-sm">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="close">close</span>
</button>
<div class="glass-panel px-4 py-2 rounded-full flex items-center gap-2 shadow-sm">
<div class="w-2 h-2 rounded-full bg-success animate-pulse"></div>
<span class="font-label-md text-label-md text-on-surface-variant">Tutor Active</span>
</div>
<button class="w-12 h-12 rounded-full flex items-center justify-center bg-surface border border-outline-variant hover:bg-surface-container-low transition-colors shadow-sm">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-center px-container-margin-mobile relative z-10 w-full max-w-lg mx-auto">
<!-- Ambient Background Glow (Subtle) -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-primary-container rounded-full blur-[100px] opacity-10 pointer-events-none"></div>
<!-- Voice Indicator (Pulsing Rings) -->
<div class="relative w-48 h-48 flex items-center justify-center mb-stack-lg animate-bounce-soft">
<!-- Ripple 1 -->
<div class="absolute inset-0 rounded-full border-2 border-primary-fixed bg-indigo-soft animate-pulse-ring"></div>
<!-- Ripple 2 -->
<div class="absolute inset-4 rounded-full border-2 border-primary-fixed bg-surface-container opacity-50 animate-pulse-ring-delayed"></div>
<!-- Central Core -->
<div class="relative w-24 h-24 rounded-full bg-primary flex items-center justify-center shadow-[0_10px_25px_-5px_rgba(70,72,212,0.4)] z-10">
<span class="material-symbols-outlined text-on-primary text-4xl" data-icon="graphic_eq" data-weight="fill" style="font-variation-settings: 'FILL' 1;">graphic_eq</span>
</div>
</div>
<!-- Status Text -->
<p class="font-body-lg text-body-lg text-primary mb-stack-sm tracking-wide opacity-80">
            শুনছি...
        </p>
<!-- Live Transcription Area -->
<div class="w-full text-center px-4 min-h-[80px] flex items-center justify-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background leading-tight">
                "2x + 5 = 15 কীভাবে সমাধান করব?"
            </h1>
</div>
</main>
<!-- Bottom Controls (Floating) -->
<footer class="w-full px-container-margin-mobile pb-8 pt-4 z-10 flex justify-center items-center gap-6">
<!-- Keyboard -->
<button class="w-14 h-14 rounded-full bg-surface border border-outline-variant flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-all shadow-sm active:scale-95">
<span class="material-symbols-outlined" data-icon="keyboard">keyboard</span>
</button>
<!-- Stop / End Interaction -->
<button class="w-20 h-20 rounded-full bg-error text-on-error flex items-center justify-center shadow-[0_8px_20px_-4px_rgba(239,68,68,0.3)] hover:scale-105 transition-transform active:scale-95">
<span class="material-symbols-outlined text-3xl" data-icon="stop" data-weight="fill" style="font-variation-settings: 'FILL' 1;">stop</span>
</button>
<!-- Mute -->
<button class="w-14 h-14 rounded-full bg-surface border border-outline-variant flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-all shadow-sm active:scale-95">
<span class="material-symbols-outlined" data-icon="volume_up">volume_up</span>
</button>
</footer>
</body></html>
