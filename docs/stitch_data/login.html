<div class="space-y-stack-sm">
<label class="block font-label-md text-label-md text-on-surface" for="identifier">Mobile number / email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface text-on-surface placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md transition-colors" id="identifier" name="identifier" placeholder="user@example.com / 01XXXXXXX" type="text"/>
</div>
</div>
<div class="space-y-stack-sm">
<div class="flex items-center justify-between">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md-mobile text-label-md-mobile text-primary hover:text-primary-container transition-colors" href="#">পাসওয়ার্ড ভুলে গেছ?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg bg-surface text-on-surface placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-outline-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</div>
</div>
</div>
<div class="pt-2">
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors min-h-[48px]" type="submit">
                        লগইন
                    </button>
</div>
</form>
