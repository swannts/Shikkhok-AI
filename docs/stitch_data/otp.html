<button class="hidden text-primary font-label-md text-label-md hover:underline bg-transparent border-none p-0 cursor-pointer transition-all" id="resend-btn" type="button">
                            কোড আবার পাঠাও
                        </button>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const timerElement = document.getElementById('timer');
            const countdownText = document.getElementById('countdown-text');
            const resendBtn = document.getElementById('resend-btn');
            
            // OTP Input Logic
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Allow only numbers
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                    
                    if (e.target.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
                
                // Handle paste
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
                    if (pastedData) {
                        for (let i = 0; i < pastedData.length; i++) {
                            if (inputs[i]) {
                                inputs[i].value = pastedData[i];
                            }
                        }
                        if (pastedData.length < 6) {
                            inputs[pastedData.length].focus();
                        } else {
                            inputs[5].focus();
                        }
                    }
                });
            });

            // Timer Logic
            let timeLeft = 30;
            let timerId = null;

            function updateTimerDisplay() {
                const seconds = timeLeft.toString().padStart(2, '0');
                timerElement.textContent = `00:${seconds}`;
            }

            function startTimer() {
                clearInterval(timerId);
                timeLeft = 30;
                updateTimerDisplay();
                countdownText.classList.remove('hidden');
                resendBtn.classList.add('hidden');
                
                timerId = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        countdownText.classList.add('hidden');
                        resendBtn.classList.remove('hidden');
                    }
                }, 1000);
            }

            // Initial start
            startTimer();

            // Resend button click
            resendBtn.addEventListener('click', () => {
                // Clear inputs on resend
                inputs.forEach(input => input.value = '');
                inputs[0].focus();
                
                // Reset timer visually and functionally
                startTimer();
                
                // Optional: Add visual feedback for resend action
                const btnOriginalText = resendBtn.textContent;
                resendBtn.textContent = 'পাঠানো হয়েছে';
                setTimeout(() => {
                    resendBtn.textContent = btnOriginalText;
                }, 2000);
            });
            
            // Form submission simulation
            document.getElementById('otp-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const otp = Array.from(inputs).map(input => input.value).join('');
                if(otp.length === 6) {
                    console.log('Verifying OTP:', otp);
                    // Add loading state logic here if needed
                }
            });
        });
    </script>
