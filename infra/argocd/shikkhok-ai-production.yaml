apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shikkhok-ai-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/swannts/Shikkhok-AI.git
    targetRevision: main
    path: infra/kubernetes/helm/shikkhok-ai
    helm:
      valueFiles:
        - values-production.example.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shikkhok-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
