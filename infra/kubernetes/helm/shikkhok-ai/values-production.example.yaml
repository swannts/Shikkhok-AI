global:
  environment: production
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

secrets:
  existingSecret: shikkhok-ai-secrets

api:
  enabled: true
  replicaCount: 3
  image: { repository: ghcr.io/shikkhok-ai/api, tag: "1.0.0" }
  service: { port: 4000 }
  env:
    aiServiceEnabled: "true"
    aiServiceBaseUrl: "http://shikkhok-ai-shikkhok-ai-ai:8000/api/v1"
    corsOrigins: https://teacher.shikkhok.ai
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 10, targetCPUUtilizationPercentage: 75 }
  podDisruptionBudget: { minAvailable: 2 }

aiService:
  enabled: true
  replicaCount: 4
  image: { repository: ghcr.io/shikkhok-ai/ai-service, tag: "1.0.0" }
  service: { port: 8000 }
  env:
    appEnv: production
    llmProvider: gemini
    embeddingProvider: gemini
    vectorStoreProvider: qdrant
    allowMockProviders: "false"
    vectorStoreAllowDemoSeed: "false"
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }
  autoscaling: { enabled: true, minReplicas: 4, maxReplicas: 20, targetCPUUtilizationPercentage: 70 }
  podDisruptionBudget: { minAvailable: 3 }
  qdrantPort: 6333
  readinessProbe:
    enabled: true
    path: /ready
    port: 8000
  livenessProbe:
    enabled: true
    path: /live
    port: 8000

worker:
  enabled: true
  replicaCount: 2
  image: { repository: ghcr.io/shikkhok-ai/worker, tag: "1.0.0" }
  healthPort: 3100
  env:
    aiServiceUrl: "http://shikkhok-ai-shikkhok-ai-ai:8000"
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  podDisruptionBudget: { minAvailable: 1 }
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 10, targetCPUUtilizationPercentage: 75 }
  readinessProbe:
    enabled: true
    path: /ready
    port: 3100
  livenessProbe:
    enabled: true
    path: /health
    port: 3100

teacherPortal:
  enabled: false
  replicaCount: 2
  image: { repository: ghcr.io/shikkhok-ai/teacher-portal, tag: "1.0.0" }
  service: { port: 3002 }
  env:
    apiUrl: "https://api.shikkhok.ai"
    aiServiceUrl: ""
  ingress:
    enabled: false
    hostname: teacher.shikkhok.ai
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  podDisruptionBudget: { minAvailable: 1 }

admin:
  enabled: false
  external: true
  description: "Admin panel is hosted externally as a static site (admin.shikkhok.ai). Set enabled: true to deploy inside this chart."
  replicaCount: 2
  image: { repository: ghcr.io/shikkhok-ai/admin, tag: "1.0.0" }
  service: { port: 3001 }
  ingress:
    enabled: false
    hostname: admin.shikkhok.ai

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - { host: api.shikkhok.ai, service: api, port: 4000 }
  tls:
    - secretName: shikkhok-ai-tls
      hosts: [api.shikkhok.ai]

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

networkPolicy:
  enabled: true
  allowedIngress:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  externalMongoCidr: "10.92.0.0/16"
  externalRedisCidr: "10.93.0.0/16"
  externalQdrantCidr: "192.0.2.0/24"
  allowedExternalEgress:
    - "192.0.2.0/24"
  workerExternalEgress:
    - "192.0.2.0/24"
