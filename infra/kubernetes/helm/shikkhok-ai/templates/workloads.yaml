{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shikkhok-ai.fullname" . }}-api
  labels: {{- include "shikkhok-ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      serviceAccountName: {{ include "shikkhok-ai.fullname" . }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      {{- with .Values.global.imagePullSecrets }}imagePullSecrets: {{ toYaml . | nindent 8 }}{{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{ name: http, containerPort: 4000 }]
          envFrom: [{ configMapRef: { name: {{ include "shikkhok-ai.fullname" . }}-config } }]
          env:
            - { name: MONGODB_URI, valueFrom: { secretKeyRef: { name: {{ include "shikkhok-ai.secretName" . }}, key: MONGODB_URI } } }
            - { name: REDIS_URL, valueFrom: { secretKeyRef: { name: {{ include "shikkhok-ai.secretName" . }}, key: REDIS_URL } } }
            - { name: JWT_ACCESS_SECRET, valueFrom: { secretKeyRef: { name: {{ include "shikkhok-ai.secretName" . }}, key: JWT_ACCESS_SECRET } } }
            - { name: JWT_REFRESH_SECRET, valueFrom: { secretKeyRef: { name: {{ include "shikkhok-ai.secretName" . }}, key: JWT_REFRESH_SECRET } } }
            - { name: AI_SERVICE_SECRET, valueFrom: { secretKeyRef: { name: {{ include "shikkhok-ai.secretName" . }}, key: AI_SERVICE_SECRET } } }
          readinessProbe: { httpGet: { path: /api/v1/health/ready, port: http }, periodSeconds: 10, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /api/v1/health/live, port: http }, initialDelaySeconds: 20, periodSeconds: 20, timeoutSeconds: 3 }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
{{- end }}
{{- if .Values.aiService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shikkhok-ai.fullname" . }}-ai
  labels: {{- include "shikkhok-ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.aiService.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/component: ai, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/component: ai, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      serviceAccountName: {{ include "shikkhok-ai.fullname" . }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: ai
          image: "{{ .Values.aiService.image.repository }}:{{ .Values.aiService.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: {{ include "shikkhok-ai.fullname" . }}-config } }]
          env:
            - { name: INTERNAL_SERVICE_SECRET, valueFrom: { secretKeyRef: { name: {{ include "shikkhok-ai.secretName" . }}, key: AI_SERVICE_SECRET } } }
            - { name: LLM_API_KEY, valueFrom: { secretKeyRef: { name: {{ include "shikkhok-ai.secretName" . }}, key: LLM_API_KEY } } }
            - { name: EMBEDDING_API_KEY, valueFrom: { secretKeyRef: { name: {{ include "shikkhok-ai.secretName" . }}, key: EMBEDDING_API_KEY } } }
          readinessProbe: { httpGet: { path: /api/v1/health, port: http }, periodSeconds: 10, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /api/v1/health, port: http }, initialDelaySeconds: 20, periodSeconds: 20, timeoutSeconds: 3 }
          resources: {{- toYaml .Values.aiService.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
{{- end }}
{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shikkhok-ai.fullname" . }}-worker
  labels: {{- include "shikkhok-ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/component: worker, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/component: worker, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      serviceAccountName: {{ include "shikkhok-ai.fullname" . }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - { name: NODE_ENV, value: {{ .Values.global.environment | quote }} }
            - { name: REDIS_URL, valueFrom: { secretKeyRef: { name: {{ include "shikkhok-ai.secretName" . }}, key: REDIS_URL } } }
            - { name: MONGODB_URI, valueFrom: { secretKeyRef: { name: {{ include "shikkhok-ai.secretName" . }}, key: MONGODB_URI } } }
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
{{- end }}
