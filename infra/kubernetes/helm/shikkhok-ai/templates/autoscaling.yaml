{{- if and .Values.api.enabled .Values.api.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: {{ include "shikkhok-ai.fullname" . }}-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "shikkhok-ai.fullname" . }}-api }
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }} } } }]
---
{{- end }}
{{- if and .Values.aiService.enabled .Values.aiService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: {{ include "shikkhok-ai.fullname" . }}-ai }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "shikkhok-ai.fullname" . }}-ai }
  minReplicas: {{ .Values.aiService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.aiService.autoscaling.maxReplicas }}
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.aiService.autoscaling.targetCPUUtilizationPercentage }} } } }]
---
{{- end }}
{{- if and .Values.worker.enabled .Values.worker.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: {{ include "shikkhok-ai.fullname" . }}-worker }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "shikkhok-ai.fullname" . }}-worker }
  minReplicas: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.worker.autoscaling.maxReplicas }}
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.worker.autoscaling.targetCPUUtilizationPercentage }} } } }]
{{- end }}
