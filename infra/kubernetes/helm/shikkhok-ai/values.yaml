global:
  environment: production
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

secrets:
  existingSecret: shikkhok-ai-secrets

api:
  enabled: true
  replicaCount: 3
  image: { repository: ghcr.io/shikkhok-ai/api, tag: "1.0.0" }
  service: { port: 4000 }
  env:
    aiServiceEnabled: "true"
    aiServiceBaseUrl: ""
    corsOrigins: https://teacher.shikkhok.ai
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 10, targetCPUUtilizationPercentage: 75 }
  podDisruptionBudget: { minAvailable: 2 }

aiService:
  enabled: true
  replicaCount: 4
  image: { repository: ghcr.io/shikkhok-ai/ai-service, tag: "1.0.0" }
  service: { port: 8000 }
  env:
    appEnv: production
    llmProvider: gemini
    embeddingProvider: gemini
    vectorStoreProvider: persistent
    allowMockProviders: "false"
    vectorStoreAllowDemoSeed: "false"
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }
  autoscaling: { enabled: true, minReplicas: 4, maxReplicas: 20, targetCPUUtilizationPercentage: 70 }
  podDisruptionBudget: { minAvailable: 3 }

worker:
  enabled: true
  replicaCount: 2
  image: { repository: ghcr.io/shikkhok-ai/worker, tag: "1.0.0" }
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  podDisruptionBudget: { minAvailable: 1 }

teacherPortal:
  enabled: false
  replicaCount: 2
  image: { repository: ghcr.io/shikkhok-ai/teacher-portal, tag: "1.0.0" }
  service: { port: 3002 }

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - { host: api.shikkhok.ai, service: api, port: 4000 }
    - { host: ai.shikkhok.ai, service: ai, port: 8000 }
  tls:
    - secretName: shikkhok-ai-tls
      hosts: [api.shikkhok.ai, ai.shikkhok.ai]

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}
