global:
  environment: production
  domain: shikkhok.ai
  imagePullPolicy: IfNotPresent

api:
  enabled: true
  replicaCount: 3
  image:
    repository: ghcr.io/shikkhok-ai/api
    tag: latest
  service:
    type: ClusterIP
    port: 4000
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75

aiService:
  enabled: true
  replicaCount: 4
  image:
    repository: ghcr.io/shikkhok-ai/ai-service
    tag: latest
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 2000m
      memory: 2048Mi
    requests:
      cpu: 500m
      memory: 1024Mi
  autoscaling:
    enabled: true
    minReplicas: 4
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

worker:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/shikkhok-ai/worker
    tag: latest
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 256Mi

teacherPortal:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/shikkhok-ai/teacher-portal
    tag: latest
  service:
    type: ClusterIP
    port: 3002
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: api.shikkhok.ai
      paths:
        - path: /
          pathType: Prefix
          service: api
          port: 4000
    - host: teacher.shikkhok.ai
      paths:
        - path: /
          pathType: Prefix
          service: teacherPortal
          port: 3002
  tls:
    - secretName: shikkhok-ai-tls
      hosts:
        - api.shikkhok.ai
        - teacher.shikkhok.ai
