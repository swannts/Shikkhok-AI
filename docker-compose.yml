services:
  # -------------------------------------------------------------
  # 1. MONGODB NOSQL DATABASE
  # -------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: shikkhok-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-shikkhok_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-shikkhok_secure_password}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-shikkhok_db}
    ports:
      - '27017:27017'
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - mongodb_data:/data/db

  # -------------------------------------------------------------
  # 2. REDIS CACHE
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: shikkhok-redis
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: shikkhok-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-shikkhok}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-shikkhok-local-password}
    ports:
      - '5672:5672'
      - '127.0.0.1:15672:15672'
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # -------------------------------------------------------------
  # 3. MAIN NESTJS API SERVICE
  # -------------------------------------------------------------
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: shikkhok-api
    restart: always
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
      MONGODB_URI: ${MONGODB_URI:-mongodb://shikkhok_admin:shikkhok_secure_password@mongodb:27017/shikkhok_db?authSource=admin}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://shikkhok:shikkhok-local-password@rabbitmq:5672/}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-shikkhok-development-only-access-secret-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-shikkhok-development-only-refresh-secret-2026}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:4000,http://localhost:8080,http://localhost:8081}
      AI_HMAC_SECRET: ${AI_HMAC_SECRET:-${AI_SERVICE_SECRET:-dev-internal-ai-service-secret-at-least-32chars}}
      AI_SERVICE_ENABLED: ${AI_SERVICE_ENABLED:-true}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://ai:8000/api/v1}
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:-${AI_HMAC_SECRET:-dev-internal-ai-service-secret-at-least-32chars}}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/v1/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./data/curriculum-uploads:/app/uploads/curriculum
      - ./books/class-3:/app/uploads/curriculum/split-books/class-3:ro

  # -------------------------------------------------------------
  # 4. DEDICATED FASTAPI AI SERVICE
  # -------------------------------------------------------------
  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: shikkhok-ai-service
    restart: always
    ports:
      - '8000:8000'
    environment:
      PORT: 8000
      APP_ENV: ${NODE_ENV:-development}
      INTERNAL_SERVICE_SECRET: ${AI_SERVICE_SECRET:-${AI_HMAC_SECRET:-dev-internal-ai-service-secret-at-least-32chars}}
      ALLOW_MOCK_PROVIDERS: ${ALLOW_MOCK_PROVIDERS:-false}
      NEST_API_BASE_URL: http://api:4000/api/v1
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_API_KEY: ${GEMINI_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_MODEL: ${HUGGINGFACE_MODEL:-Qwen/Qwen2.5-7B-Instruct-1M:fastest}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-none}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      EMBEDDING_API_KEY: ${GEMINI_API_KEY}
      VECTOR_STORE_PROVIDER: ${VECTOR_STORE_PROVIDER:-persistent}
      VECTOR_STORE_ALLOW_DEMO_SEED: ${VECTOR_STORE_ALLOW_DEMO_SEED:-false}
      VECTOR_STORE_ALLOW_LEGACY_FALLBACK: ${VECTOR_STORE_ALLOW_LEGACY_FALLBACK:-true}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------
  # 5. ASYNCHRONOUS WORKER SERVICE
  # -------------------------------------------------------------
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: shikkhok-worker
    restart: always
    ports:
      - '3100:3100'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://shikkhok:shikkhok-local-password@rabbitmq:5672/}
      AI_SERVICE_URL: http://ai:8000
      AI_HMAC_SECRET: ${AI_HMAC_SECRET:-${AI_SERVICE_SECRET:-dev-internal-ai-service-secret-at-least-32chars}}
      API_SERVICE_URL: http://api:4000
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:-${AI_HMAC_SECRET:-dev-internal-ai-service-secret-at-least-32chars}}
      WORKER_HEALTH_PORT: 3100
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./data/curriculum-uploads:/app/uploads/curriculum

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:
