version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. POSTGRESQL + PGVECTOR DATABASE
  # -------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: shikkhok-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shikkhok_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shikkhok_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-shikkhok_db}
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shikkhok_user} -d ${POSTGRES_DB:-shikkhok_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # -------------------------------------------------------------
  # 2. REDIS CACHE & JOB BROKER
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: shikkhok-redis
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  # -------------------------------------------------------------
  # 3. MAIN API SERVICE
  # -------------------------------------------------------------
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: shikkhok-api
    restart: always
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://shikkhok_user:shikkhok_secure_password@postgres:5432/shikkhok_db?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-shikkhok-development-only-jwt-secret-key-2026-min-32-chars}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4000,http://localhost:8081}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------------------------
  # 4. AI GATEWAY SERVICE
  # -------------------------------------------------------------
  ai-gateway:
    build:
      context: ./services/ai-gateway
      dockerfile: Dockerfile
    container_name: shikkhok-ai-gateway
    restart: always
    ports:
      - '4001:4001'
    environment:
      PORT: 4001
      NODE_ENV: ${NODE_ENV:-development}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_started

  # -------------------------------------------------------------
  # 5. ASYNCHRONOUS WORKER SERVICE
  # -------------------------------------------------------------
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: shikkhok-worker
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL:-postgresql://shikkhok_user:shikkhok_secure_password@postgres:5432/shikkhok_db?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
