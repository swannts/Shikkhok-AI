name: Shikkhok-AI Continuous Integration & Production Verification

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # -------------------------------------------------------------
  # 1. FASTAPI AI & RAG SERVICE
  # -------------------------------------------------------------
  ai-service:
    name: FastAPI AI Service (Pytest & MyPy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        working-directory: ./services/ai
        run: uv sync --all-extras --dev
      - name: Lint and formatting
        working-directory: ./services/ai
        run: uv run ruff check . && uv run mypy app
      - name: Run Pytest Suite
        working-directory: ./services/ai
        run: uv run pytest

  # -------------------------------------------------------------
  # 2. NESTJS BACKEND API
  # -------------------------------------------------------------
  backend-api:
    name: NestJS API (Build, Unit & Gateway Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/api/package.json
      - name: Install dependencies
        working-directory: ./services/api
        run: npm ci
      - name: Build TypeScript
        working-directory: ./services/api
        run: npm run build
      - name: Run Jest Test Suites
        working-directory: ./services/api
        run: npm test

  # -------------------------------------------------------------
  # 3. BULLMQ WORKER DAEMON
  # -------------------------------------------------------------
  background-worker:
    name: BullMQ Background Worker (Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build
        working-directory: ./services/worker
        run: npm install && npm run build

  # -------------------------------------------------------------
  # 4. TEACHER PORTAL NEXT.JS
  # -------------------------------------------------------------
  teacher-portal:
    name: Teacher Portal (Next.js 15 Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build
        working-directory: ./apps/teacher-portal
        run: npm install --legacy-peer-deps && npm run build

  # -------------------------------------------------------------
  # 5. FLUTTER MOBILE APP
  # -------------------------------------------------------------
  flutter-mobile:
    name: Flutter Mobile (Analyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        working-directory: ./apps/mobile
        run: flutter pub get
      - name: Analyze Flutter codebase
        working-directory: ./apps/mobile
        run: flutter analyze
