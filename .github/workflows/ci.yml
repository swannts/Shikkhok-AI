name: Shikkhok-AI Continuous Integration & Production Verification

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  infrastructure:
    name: Helm Infrastructure Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint Helm chart
        run: helm lint infra/kubernetes/helm/shikkhok-ai
      - name: Render Helm chart
        run: helm template shikkhok-ai infra/kubernetes/helm/shikkhok-ai > /tmp/shikkhok-ai-manifests.yaml
      - name: Validate production profile and optional teacher portal
        run: |
          helm lint infra/kubernetes/helm/shikkhok-ai \
            -f infra/kubernetes/helm/shikkhok-ai/values-production.example.yaml
          helm template shikkhok-ai infra/kubernetes/helm/shikkhok-ai \
            -f infra/kubernetes/helm/shikkhok-ai/values-production.example.yaml \
            --set teacherPortal.enabled=true > /tmp/shikkhok-ai-production.yaml
          ! grep -Eq '0\.0\.0\.0/0|10\.0\.0\.0/8|(^|-) \{\}' /tmp/shikkhok-ai-production.yaml
      - name: Validate rendered manifests
        run: |
          grep -q "kind: Deployment" /tmp/shikkhok-ai-manifests.yaml
          grep -q "kind: Service" /tmp/shikkhok-ai-manifests.yaml

  ai-service:
    name: FastAPI AI Service (Pytest & MyPy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        working-directory: ./services/ai
        run: uv sync --all-extras --dev
      - name: Lint and formatting
        working-directory: ./services/ai
        run: uv run ruff check . && uv run mypy app
      - name: Run Pytest Suite
        working-directory: ./services/ai
        run: uv run pytest

  backend-api:
    name: NestJS API (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/api/package.json
      - name: Install dependencies
        working-directory: ./services/api
        run: npm ci
      - name: Build TypeScript
        working-directory: ./services/api
        run: npm run build
      - name: Lint
        working-directory: ./services/api
        run: npm run lint:check
      - name: Run Jest Test Suites
        working-directory: ./services/api
        run: npm test

  background-worker:
    name: BullMQ Background Worker (Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build
        working-directory: ./services/worker
        run: npm ci && npm run build
      - name: TypeScript type-check
        working-directory: ./services/worker
        run: npx tsc --noEmit

  teacher-portal:
    name: Teacher Portal (Next.js 15 Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build
        working-directory: ./apps/teacher-portal
        run: npm ci --legacy-peer-deps && npm run build

  flutter-mobile:
    name: Flutter Mobile (Analyzer & Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        working-directory: ./apps/mobile
        run: flutter pub get
      - name: Check Dart formatting
        working-directory: ./apps/mobile
        run: dart format --set-exit-if-changed lib test
      - name: Analyze Flutter codebase
        working-directory: ./apps/mobile
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: ./apps/mobile
        run: flutter test

  docker-compose-validation:
    name: Docker Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet
